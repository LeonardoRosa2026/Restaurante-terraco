<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terraço Restaurante</title>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f8fc;
    color: #172033;
}

header {
    background: #0057a8;
    color: white;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav {
    margin-top: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    font-weight: bold;
}

.hero {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;

    background:
    linear-gradient(rgba(0,60,120,.75),rgba(0,60,120,.75)),
    url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80");

    background-size: cover;
    background-position: center;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 20px;
    margin-bottom: 25px;
}

.botao {
    display: inline-block;
    background: #168bea;
    color: white;
    padding: 14px 25px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
}

section {
    padding: 60px 7%;
}

.titulo {
    text-align: center;
    color: #0057a8;
    font-size: 35px;
    margin-bottom: 15px;
}

.subtitulo {
    text-align: center;
    color: #667085;
    margin-bottom: 35px;
}

.sobre {
    max-width: 850px;
    margin: auto;
    text-align: center;
    font-size: 18px;
    line-height: 1.8;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.card div {
    padding: 20px;
}

.card h3 {
    color: #0057a8;
    margin-bottom: 10px;
    font-size: 22px;
}

.card p {
    color: #667085;
    line-height: 1.5;
}

.preco {
    display: block;
    margin-top: 15px;
    color: #168bea;
    font-weight: bold;
}

.experiencia {
    background: #0057a8;
    color: white;
    text-align: center;
}

.experiencia .titulo {
    color: white;
}

.experiencia p {
    max-width: 800px;
    margin: auto;
    line-height: 1.8;
    font-size: 18px;
}

.contato {
    text-align: center;
}

.informacoes {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.informacoes div {
    background: white;
    padding: 25px;
    border-radius: 15px;
    min-width: 220px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.informacoes h3 {
    color: #0057a8;
    margin-bottom: 10px;
}
